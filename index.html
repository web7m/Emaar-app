<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Identity Badge</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #f2f2f6;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 390px;
      background-color: #ffffff;
      min-height: 844px;
      padding: 10px 20px 20px 20px; /* تم تقليل الـ padding العلوي لرفع المحتوى */
      position: relative;
      border-radius: 30px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
    }

    /* --- الهيدر العلوي تم رفعه وتقليل مسافاته --- */
    .header {
      display: flex;
      align-items: center;
      padding-top: 0px;    /* تم إلغاء المسافة من الأعلى لرفعه تماماً */
      padding-bottom: 5px;  /* تقليل المسافة أسفله */
      margin-top: -5px;     /* إزاحة خفيفة لأعلى */
      position: relative;
    }

    .back-btn {
      background: none;
      border: none;
      font-size: 20px;
      cursor: pointer;
      color: #000;
      position: absolute;
      left: 0;
      display: flex;
      align-items: center;
    }

    .header-title {
      width: 100%;
      text-align: center;
      font-size: 20px;
      font-weight: 700;
      color: #000;
      font-family: "Georgia", serif; /* مطابقة خط العنوان للسكيل */
    }

    /* --- كارت صورة الهوية والمعلومات --- */
    .badge-card {
      margin-top: 20px; /* تقليل المسافة بين العنوان والصورة */
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .profile-avatar {
      width: 240px;
      height: 240px;
      border-radius: 50%;
      object-fit: cover;
      border: 15px solid #dcd7c9;
      margin-bottom: 25px;
    }

    .info-box {
      width: 100%;
      background-color: #72e096; /* لون اسم المستخدم الأخضر */
      padding: 12px 16px;
      border-radius: 4px;
      margin-bottom: 15px;
    }

    .info-label {
      font-size: 13px;
      color: #333;
      margin-bottom: 2px;
    }

    .info-value {
      font-size: 17px;
      font-weight: bold;
      color: #000;
    }

    .unit-box {
      width: 100%;
      padding: 5px 16px 15px 16px;
      margin-bottom: 20px;
    }

    .unit-box .info-value {
      font-size: 16px;
    }

    /* --- الزرار والملاحظات --- */
    .open-gate-btn {
      width: 100%;
      background-color: #555555;
      color: #ffffff;
      border: none;
      padding: 14px;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 15px;
    }

    .disclaimer {
      font-size: 11px;
      color: #555;
      text-align: center;
      line-height: 1.3;
      padding: 0 10px;
      margin-bottom: 40px;
    }

    .brand-logo {
      text-align: center;
      margin-top: auto;
    }

    .brand-logo h3 {
      letter-spacing: 4px;
      font-size: 18px;
      font-family: "Georgia", serif;
      color: #000;
    }

    .brand-logo p {
      font-size: 9px;
      letter-spacing: 2px;
      color: #555;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- الجزء العلوي (Identity Badge) -->
    <div class="header">
      <button class="back-btn">&lt;</button>
      <h1 class="header-title">Identity Badge</h1>
    </div>

    <!-- كارت الهوية -->
    <div class="badge-card">
      <img src="your-photo.jpg" alt="Profile" class="profile-avatar">

      <div class="info-box">
        <div class="info-label">Username</div>
        <div class="info-value">Mohamed Elattar</div>
      </div>

      <div class="unit-box">
        <div class="info-label">Unit</div>
        <div class="info-value">VIDA Marina-SA-TL-33</div>
      </div>

      <button class="open-gate-btn">Open Gate</button>

      <p class="disclaimer">
        Any proven manipulation of this identity card will result in a EGP 30,000 fine and user suspension.
      </p>

      <div class="brand-logo">
        <h3>EMAAR</h3>
        <p>MISR</p>
      </div>
    </div>
  </div>

</body>
</html>
