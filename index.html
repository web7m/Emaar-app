<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Identity Badge</title>
  <!-- Google Fonts for exact Serif headers -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..700;1,6..96,400..700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      /* Default iOS UI Font */
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    body {
      background-color: #f2f2f6;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      color: #000;
    }

    /* App Container Frame */
    .app-screen {
      width: 100%;
      max-width: 414px;
      background-color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 20px;
      position: relative;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
    }

    /* Header */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-top: 10px;
      padding-bottom: 15px;
    }

    .back-btn {
      font-size: 24px;
      background: none;
      border: none;
      cursor: pointer;
      color: #000;
      font-weight: 300;
    }

    .header-title {
      font-size: 20px;
      font-weight: 600;
      font-family: "Playfair Display", "Bodoni Moda", serif;
      letter-spacing: -0.2px;
      flex-grow: 1;
      text-align: center;
      margin-right: 24px; /* Balance back button */
      color: #111;
    }

    /* Card Box */
    .badge-card {
      background-color: #f3f7f5;
      border-radius: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow: hidden;
      margin-top: 10px;
    }

    /* Circular Profile Image */
    .profile-container {
      padding: 25px 20px 18px 20px;
    }

    .profile-img {
      width: 220px;
      height: 220px;
      border-radius: 50%;
      object-fit: cover;
      display: block;
      border: 2px solid #e2e2e2;
    }

    /* Green Banner */
    .info-banner {
      width: 100%;
      background-color: #8ed888;
      padding: 10px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .info-group {
      display: flex;
      flex-direction: column;
    }

    .info-label {
      font-size: 13px;
      color: #2b5728;
      margin-bottom: 2px;
      font-weight: 400;
    }

    .info-value {
      font-size: 15px;
      font-weight: 700;
      color: #000;
      letter-spacing: -0.2px;
    }

    /* Unit Section */
    .unit-section {
      width: 100%;
      padding: 16px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: #f3f7f5;
    }

    .unit-value {
      font-size: 15px;
      font-weight: 800;
      color: #000;
      margin-top: 2px;
      letter-spacing: -0.2px;
    }

    .logo-badge {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 1px solid #dcdcdc;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 7px;
      font-weight: 700;
      color: #444;
      background: #fff;
      font-family: sans-serif;
      text-align: center;
    }

    /* Action & Fine Notice */
    .action-container {
      margin-top: 25px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
    }

    .open-gate-btn {
      width: 100%;
      background-color: #555555;
      color: #ffffff;
      border: none;
      border-radius: 14px;
      padding: 16px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s ease, opacity 0.2s ease;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 52px;
    }

    .open-gate-btn:active {
      background-color: #333333;
    }

    .open-gate-btn.loading {
      opacity: 0.85;
      cursor: wait;
    }

    /* iOS Loading Spinner */
    .spinner {
      width: 20px;
      height: 20px;
      border: 3px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      border-top-color: #ffffff;
      animation: spin 0.8s linear infinite;
      display: none;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .fine-notice {
      font-size: 12px;
      color: #111;
      text-align: center;
      line-height: 1.4;
      max-width: 90%;
      font-weight: 500;
    }

    /* Footer Logo */
    .footer {
      text-align: center;
      padding-bottom: 15px;
      margin-top: 40px;
    }

    .emaar-logo {
      font-family: "Playfair Display", "Bodoni Moda", serif;
      font-size: 20px;
      letter-spacing: 5px;
      font-weight: 600;
      color: #222;
    }

    .emaar-sub {
      font-size: 9px;
      letter-spacing: 3px;
      color: #555;
      margin-top: -2px;
      font-weight: 600;
    }

    /* iOS Alert Modal Overlay */
    .modal-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.25);
      backdrop-filter: blur(5px);
      -webkit-backdrop-filter: blur(5px);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .modal-overlay.active {
      display: flex;
    }

    /* iOS Style Popup */
    .ios-alert {
      width: 270px;
      background-color: rgba(245, 245, 245, 0.95);
      border-radius: 14px;
      text-align: center;
      overflow: hidden;
      box-shadow: 0 10px 25px rgba(0,0,0,0.15);
      animation: popup 0.2s ease-out;
    }

    @keyframes popup {
      from { transform: scale(1.15); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    .ios-alert-content {
      padding: 22px 16px;
    }

    .ios-alert-title {
      font-size: 17px;
      font-weight: 600;
      color: #000;
      letter-spacing: -0.4px;
    }

    .ios-alert-btn {
      width: 100%;
      background: transparent;
      border: none;
      border-top: 0.5px solid #d1d1d6;
      color: #007aff;
      font-size: 17px;
      font-weight: 600;
      padding: 12px 0;
      cursor: pointer;
    }

    .ios-alert-btn:active {
      background-color: #e5e5ea;
    }
  </style>
</head>
<body>

  <div class="app-screen">
    <div>
      <!-- Header -->
      <div class="header">
        <button class="back-btn">&#10094;</button>
        <div class="header-title">Identity Badge</div>
      </div>

      <!-- Main Badge Card -->
      <div class="badge-card">
        <div class="profile-container">
          <img src="
        </div>

        <!-- Green Info Banner -->
        <div class="info-banner">
          <div class="info-group">
            <span class="info-label">Username</span>
            <span class="info-value">Ahmed Mohamed</span>
          </div>
          <div class="info-group" style="text-align: right;">
            <span class="info-label">Type</span>
            <span class="info-value">Resident</span>
          </div>
        </div>

        <!-- Unit Details -->
        <div class="unit-section">
          <div class="info-group">
            <span class="info-label">Unit</span>
            <span class="unit-value">VIDA Marina-SA-TL-33</span>
          </div>
          <div class="logo-badge">MARASSI</div>
        </div>
      </div>

      <!-- Actions -->
      <div class="action-container">
        <button class="open-gate-btn" id="openGateBtn">
          <span id="btnText">Open Gate</span>
          <div class="spinner" id="btnSpinner"></div>
        </button>
        <p class="fine-notice">
          Any proven manipulation of this identity will result in a EGP 30,000 fine and user suspension.
        </p>
      </div>
    </div>

    <!-- Footer -->
    <div class="footer">
      <div class="emaar-logo">EMAAR</div>
      <div class="emaar-sub">MISR</div>
    </div>

    <!-- Modal Alert (Image 2) -->
    <div class="modal-overlay" id="alertModal">
      <div class="ios-alert">
        <div class="ios-alert-content">
          <div class="ios-alert-title">Gate not in range</div>
        </div>
        <button class="ios-alert-btn" id="closeModalBtn">Ok</button>
      </div>
    </div>
  </div>

  <script>
    const openGateBtn = document.getElementById('openGateBtn');
    const btnText = document.getElementById('btnText');
    const btnSpinner = document.getElementById('btnSpinner');
    const alertModal = document.getElementById('alertModal');
    const closeModalBtn = document.getElementById('closeModalBtn');

    openGateBtn.addEventListener('click', () => {
      // Prevent multiple clicks while loading
      if (openGateBtn.classList.contains('loading')) return;

      // Start Loading State
      openGateBtn.classList.add('loading');
      btnText.style.display = 'none';
      btnSpinner.style.display = 'block';

      // Wait for 2.5 seconds, then show the popup
      setTimeout(() => {
        // Reset Button
        openGateBtn.classList.remove('loading');
        btnText.style.display = 'inline';
        btnSpinner.style.display = 'none';

        // Display Modal Alert
        alertModal.classList.add('active');
      }, 2500); 
    });

    closeModalBtn.addEventListener('click', () => {
      alertModal.classList.remove('active');
    });
  </script>

</body>
</html>
